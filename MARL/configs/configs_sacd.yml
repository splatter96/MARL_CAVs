# needed to not change the cwd but stay in current folder
hydra:
  job:
    chdir: False

curriculum: True
seed: 84

env:
  use_weaving: True
  duration: 15
  policy_frequency: 5
  #policy_frequency: 15
  reward_speed_range: [10, 30]
  collision_reward: 200
  high_speed_reward: 1
  #high_speed_reward: 0.333
  traffic_density: 3
  #traffic_density: 1
  offramp_reward: 100
  LANE_CHANGE_COST: 1
  #LANE_CHANGE_COST: 0.333

  HEADWAY_COST: 4
  #HEADWAY_COST: 1.333

algo:
  net_size: 256
  #learning_starts: 1000
  learning_starts: 10000
  buffer_size: 500000
  learning_rate: 5e-4
  train_freq: 8
  #train_freq: 1
  gradient_steps: 64
  #gradient_steps: 8
  max_grad_norm: 30
  target_update_interval: 8000
  #target_update_interval: 1
  batch_size: 256
  gamma: 0.99
  num_envs: 32

  target_entropy: 0.5
  ent_coef: "auto_0.1"

logging:
  exp_tag: collision_offramp_sweep
  wandb_project: weaving
