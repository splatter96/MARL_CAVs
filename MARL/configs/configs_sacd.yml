curriculum: true
seed: 42
gpu: 0

env:
  duration: 15
  policy_frequency: 5
  merging_speed_reward: -0.5
  right_lane_reward: 0.1
  lane_change_reward: -0.05
  reward_speed_range: [10, 30]
  collision_reward: 200
  high_speed_reward: 1
  safety_guarantee: false
  traffic_density: 3
  offramp_reward: 100

algo:
  net_size: 256
  learning_starts: 1000
  buffer_size: 500000
  learning_rate: 5e-4
  train_freq: 8
  gradient_steps: 64
  max_grad_norm: 30
  target_update_interval: 8000
  batch_size: 256
  gamma: 0.99
  num_envs: 1

logging:
  output_dir: ./results
  exp_tag: hydra_test
  wandb_project: sb3_test
